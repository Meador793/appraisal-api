# Build the image, push it to ECR, and force ECS to pick it up.
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID      a DEPLOY-ONLY IAM user, not your admin user
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION             e.g. us-east-2
#   ECR_REPOSITORY         appraisal-api
#   ECS_CLUSTER            appraisal-cluster
#   ECS_SERVICE            appraisal-svc
#
# ONLY RELEVANT IF YOU DEPLOY THE ALWAYS-ON API TO ECS (see DEPLOY.md).
# The S3 -> Lambda batch pipeline (DEPLOY_S3_PIPELINE.md) has no long-running
# service to redeploy, so this workflow does not apply to it -- pushing a new
# Lambda image is a single `aws lambda update-function-code` call, not a
# service that needs to be told to pick up a new image.
#
# Note what this workflow does NOT do: retrain the model. Phase 1 artifacts are
# produced by the notebook (or a batch analysis job) and promoted deliberately,
# by a human. Retraining on every commit would mean a code change could
# silently alter every adjustment in a report.

name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you trigger a redeploy by hand

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY }}
          # Tag with the commit SHA, not just :latest. When a deployment starts
          # returning different numbers you need to know exactly which commit is
          # running, and :latest cannot tell you that.
          SHA: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t "$REGISTRY/$REPO:$SHA" -t "$REGISTRY/$REPO:latest" .
          docker push "$REGISTRY/$REPO:$SHA"
          docker push "$REGISTRY/$REPO:latest"

      - name: Force a new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --force-new-deployment

      - name: Wait for the service to stabilise
        # Without this the job goes green the moment the API call returns, even
        # if the new task crashes on startup. Waiting means a broken deploy
        # shows up as a red build instead of a silently failing service.
        run: |
          aws ecs wait services-stable \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --services "${{ secrets.ECS_SERVICE }}"
